name: moon-table
services:
  app:
    image: ${IMAGE_REF:-happy-online:0.8.4}
    build:
      context: .
      target: runtime
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-3100}:3000"
    environment:
      SECURE_COOKIES: "0"
      ADMIN_BOOTSTRAP_HANDLE: "${ADMIN_BOOTSTRAP_HANDLE:-}"
      AI_DM_API_KEY: "${AI_DM_API_KEY:-}"
      AI_DM_BASE_URL: "${AI_DM_BASE_URL:-https://api.openai.com/v1}"
      AI_DM_MODEL: "${AI_DM_MODEL:-}"
    volumes:
      - moon-data:/data
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 20s
volumes:
  moon-data:
