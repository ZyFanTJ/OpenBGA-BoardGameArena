<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CABO · 卡牌素材预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0c1724;color:#f2eddf;font-family:system-ui,"Microsoft YaHei",sans-serif}main{max-width:1240px;margin:auto;padding:40px 24px}header{display:flex;align-items:end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:30px}h1{font-size:36px;letter-spacing:.08em;margin:0 0 12px}p{color:#a8b9c5;line-height:1.7;margin:0}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.toolbar button{background:#20364a;color:#f2eddf;border:1px solid #4c6171;border-radius:8px;padding:10px 15px;cursor:pointer}.toolbar button:focus-visible,.card:focus-visible{outline:3px solid #f7d978;outline-offset:5px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:26px 22px}.card{display:block;position:relative;width:100%;aspect-ratio:2/3;padding:0;border:5px solid #eee6d1;border-radius:12px;overflow:hidden;background:#163049;cursor:pointer;box-shadow:0 8px 22px #0005;transition:transform .2s,box-shadow .2s;color:white}.card:hover{transform:translateY(-5px);box-shadow:0 12px 26px #0009}.art{position:absolute;inset:0;background-image:url('cabo-atlas-v1.png');background-size:400% 400%;background-position:var(--x) var(--y)}.card.back .art{background-position:66.666667% 100%}.num{position:absolute;top:4%;left:6%;font-family:Arial,sans-serif;font-size:clamp(24px,4vw,54px);font-weight:500;line-height:1;text-shadow:0 2px 4px #000,1px 0 2px #000}.num.bottom{top:auto;left:auto;right:6%;bottom:4%;transform:rotate(180deg)}.underline{text-decoration:underline;text-underline-offset:5px}.skill{position:absolute;bottom:4%;left:6%;font-weight:800;text-align:left;text-shadow:0 2px 3px #000,1px 0 2px #000;font-size:clamp(13px,1.7vw,23px);line-height:1.1}.skill strong{display:block;font-size:clamp(17px,2.3vw,30px);font-style:italic}.back .label,.hide-labels .label{display:none}.caption{display:flex;justify-content:space-between;gap:4px;margin-top:10px;font-size:13px;color:#bbc9d3}.caption em{font-size:11px;font-style:normal;color:#d8c99c}footer{margin-top:32px;color:#8396a7;font-size:12px;line-height:1.8}
@media(max-width:600px){main{padding:24px 16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 14px}.num{font-size:40px}.skill{font-size:19px}.skill strong{font-size:25px}h1{font-size:28px}}
@media(prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
</style><main><header><div><h1>CABO</h1><p>参考图风格 · 全套卡牌素材<br>点击卡牌翻面，查看统一牌背。</p></div><div class="toolbar"><button id="labels" aria-pressed="false">隐藏数字与技能</button><button id="reset">全部翻回正面</button><button id="atlas">查看原始图集</button></div></header>
<div class="grid"><div><button class="card" data-index="0" aria-label="月光独角兽，0 点，点击翻面" aria-pressed="false" style="--x:0%;--y:0%"><span class="art"></span><span class="label num ">0</span><span class="label num bottom ">0</span></button><div class="caption"><span>月光独角兽</span><em>00</em></div></div><div><button class="card" data-index="1" aria-label="城堡与瓢虫，1 点，点击翻面" aria-pressed="false" style="--x:33.33333333333333%;--y:0%"><span class="art"></span><span class="label num ">1</span><span class="label num bottom ">1</span></button><div class="caption"><span>城堡与瓢虫</span><em>01</em></div></div><div><button class="card" data-index="2" aria-label="追蝶，2 点，点击翻面" aria-pressed="false" style="--x:66.66666666666666%;--y:0%"><span class="art"></span><span class="label num ">2</span><span class="label num bottom ">2</span></button><div class="caption"><span>追蝶</span><em>02</em></div></div><div><button class="card" data-index="3" aria-label="螺旋植物，3 点，点击翻面" aria-pressed="false" style="--x:100%;--y:0%"><span class="art"></span><span class="label num ">3</span><span class="label num bottom ">3</span></button><div class="caption"><span>螺旋植物</span><em>03</em></div></div><div><button class="card" data-index="4" aria-label="鸟浴喷泉，4 点，点击翻面" aria-pressed="false" style="--x:0%;--y:33.33333333333333%"><span class="art"></span><span class="label num ">4</span><span class="label num bottom ">4</span></button><div class="caption"><span>鸟浴喷泉</span><em>04</em></div></div><div><button class="card" data-index="5" aria-label="月上跃动，5 点，点击翻面" aria-pressed="false" style="--x:33.33333333333333%;--y:33.33333333333333%"><span class="art"></span><span class="label num ">5</span><span class="label num bottom ">5</span></button><div class="caption"><span>月上跃动</span><em>05</em></div></div><div><button class="card" data-index="6" aria-label="林间侦探，6 点，点击翻面" aria-pressed="false" style="--x:66.66666666666666%;--y:33.33333333333333%"><span class="art"></span><span class="label num underline">6</span><span class="label num bottom underline">6</span></button><div class="caption"><span>林间侦探</span><em>06</em></div></div><div><button class="card" data-index="7" aria-label="水下鱼群，7 点，点击翻面" aria-pressed="false" style="--x:100%;--y:33.33333333333333%"><span class="art"></span><span class="label num ">7</span><span class="label num bottom ">7</span><span class="label skill">偷看<strong>PEEK</strong></span></button><div class="caption"><span>水下鱼群</span><em>07</em></div></div><div><button class="card" data-index="8" aria-label="长椅伙伴，8 点，点击翻面" aria-pressed="false" style="--x:0%;--y:66.66666666666666%"><span class="art"></span><span class="label num ">8</span><span class="label num bottom ">8</span><span class="label skill">偷看<strong>PEEK</strong></span></button><div class="caption"><span>长椅伙伴</span><em>08</em></div></div><div><button class="card" data-index="9" aria-label="金衣间谍，9 点，点击翻面" aria-pressed="false" style="--x:33.33333333333333%;--y:66.66666666666666%"><span class="art"></span><span class="label num underline">9</span><span class="label num bottom underline">9</span><span class="label skill">间谍<strong>SPY</strong></span></button><div class="caption"><span>金衣间谍</span><em>09</em></div></div><div><button class="card" data-index="10" aria-label="红发间谍，10 点，点击翻面" aria-pressed="false" style="--x:66.66666666666666%;--y:66.66666666666666%"><span class="art"></span><span class="label num ">10</span><span class="label num bottom ">10</span><span class="label skill">间谍<strong>SPY</strong></span></button><div class="caption"><span>红发间谍</span><em>10</em></div></div><div><button class="card" data-index="11" aria-label="交换伙伴，11 点，点击翻面" aria-pressed="false" style="--x:100%;--y:66.66666666666666%"><span class="art"></span><span class="label num ">11</span><span class="label num bottom ">11</span><span class="label skill">交换<strong>SWAP</strong></span></button><div class="caption"><span>交换伙伴</span><em>11</em></div></div><div><button class="card" data-index="12" aria-label="月下剪影，12 点，点击翻面" aria-pressed="false" style="--x:0%;--y:100%"><span class="art"></span><span class="label num ">12</span><span class="label num bottom ">12</span><span class="label skill">交换<strong>SWAP</strong></span></button><div class="caption"><span>月下剪影</span><em>12</em></div></div><div><button class="card" data-index="13" aria-label="故事之书，13 点，点击翻面" aria-pressed="false" style="--x:33.33333333333333%;--y:100%"><span class="art"></span><span class="label num ">13</span><span class="label num bottom ">13</span></button><div class="caption"><span>故事之书</span><em>13</em></div></div><div><button class="card" data-index="14" aria-label="统一牌背，点击翻面" aria-pressed="false" style="--x:66.66666666666666%;--y:100%"><span class="art"></span></button><div class="caption"><span>统一牌背</span><em>BACK</em></div></div><div><button class="card" data-index="15" aria-label="空白底板，点击翻面" aria-pressed="false" style="--x:100%;--y:100%"><span class="art"></span></button><div class="caption"><span>空白底板</span><em>BASE</em></div></div></div>
<footer>14 张牌面 · 统一牌背 · 通用底板<br>每格 256 × 384，文字独立叠加。本页为素材展示，不包含游戏规则实现。</footer></main>
<script>
document.querySelectorAll('.card').forEach(card=>card.addEventListener('click',()=>{card.classList.toggle('back');card.setAttribute('aria-pressed',String(card.classList.contains('back')))}));
document.querySelector('#labels').addEventListener('click',event=>{const hide=document.body.classList.toggle('hide-labels');event.target.textContent=hide?'显示数字与技能':'隐藏数字与技能';event.target.setAttribute('aria-pressed',String(hide))});
document.querySelector('#reset').addEventListener('click',()=>document.querySelectorAll('.card').forEach(c=>{c.classList.remove('back');c.setAttribute('aria-pressed','false')}));
document.querySelector('#atlas').addEventListener('click',()=>window.open('cabo-atlas-v1.png','_blank'));
</script></html>
